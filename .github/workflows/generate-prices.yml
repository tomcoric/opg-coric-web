name: Generate daily price list

# Cron je u UTC-u i NE prati Europe/Zagreb DST. 06:00 UTC = 08:00 CEST (ljeto) / 07:00 CET (zima) —
# cilj je da se cjenik mijenja od 8h ujutro po hrvatskom (ljeti točno, zimi sat ranije — GitHub
# Actions schedule ne podržava lokalnu vremensku zonu). Sam generator (scripts/generate-price-list.js)
# ionako datum i naziv datoteke uvijek računa u Europe/Zagreb vremenu, neovisno o ovom UTC okidaču.
#
# Dva termina umjesto jednog: GitHub Actions "schedule" okidač zna povremeno preskočiti
# zakazani termin pod opterećenjem njihove infrastrukture (dokumentirano, izvan naše kontrole).
# Drugi termin je sigurnosna mreža — ako je prvi već generirao današnji cjenik, drugi samo
# ponovno provjeri i ništa se ne commita (nema promjena).
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate price list
        run: npm run generate:prices

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cjenici
          if git diff --cached --quiet; then
            echo "Nema promjena za commit."
            exit 0
          fi
          git commit -m "chore: automatski generiraj dnevni cjenik ($(date -u +%Y-%m-%d))"
          git push
