name: Deploy to hosting (FTPS)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Push s GITHUB_TOKEN-om (npr. automatski commit iz generate-prices.yml) ne okida
  # "push" event na drugim workflowima — zato se ovaj deploy dodatno oslanja na
  # dovršetak tog workflowa, bez obzira kojim je tokenom pushao.
  workflow_run:
    workflows: ["Generate daily price list"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - name: Normalize server dir
        id: normalize
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          case "$DIR" in
            */) ;;
            *) DIR="$DIR/" ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Deploy dist/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.normalize.outputs.dir }}
