name: Deploy to hosting (FTPS)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      - name: Normalize server dir
        id: normalize
        run: |
          DIR="${{ secrets.FTP_SERVER_DIR }}"
          case "$DIR" in
            */) ;;
            *) DIR="$DIR/" ;;
          esac
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: DEBUG - raw upload + listing test
        run: |
          echo "debug test file $(date)" > /tmp/debug-test.txt
          echo "--- Uploading test file ---"
          curl --ssl-reqd -k -v -T /tmp/debug-test.txt "ftp://${{ secrets.FTP_SERVER }}${{ steps.normalize.outputs.dir }}debug-test.txt" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1 | tail -60
          echo "--- Listing directory after upload ---"
          curl --ssl-reqd -k --list-only "ftp://${{ secrets.FTP_SERVER }}${{ steps.normalize.outputs.dir }}" --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" 2>&1

      - name: Deploy dist/ via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.normalize.outputs.dir }}
          state-name: .ftp-deploy-sync-state-v2.json
